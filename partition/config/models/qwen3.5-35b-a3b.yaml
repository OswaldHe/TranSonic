# MoE rehearsal: 36 B params, ~71.9 GiB bf16. Exercises expert-group
# partitioning and routing capture ahead of the DeepSeek target.
name: qwen3.5-35b-a3b
source: hf:Qwen/Qwen3.5-35B-A3B
loader: auto
dtype: bfloat16
trust_remote_code: false

scope:
  vision: false
  mtp: false
  engram: false

partition:
  # Attention and the FFN/MoE of a layer are separate pieces of work: different
  # shapes, different kernels, verified separately. Splitting them is a structural
  # rule, so the seed planner applies it directly rather than depending on an agent.
  split_attention_ffn: true
  prompt: |
    Partition every decoder layer so that attention and the FFN/MoE block are
    separate modules. Keep each of those as one module where it is one piece of
    work -- do not split a projection away from the attention it feeds, and do not
    separate a normalization from the operation it normalizes for, since that
    forecloses fusing them later. Split further only when a module does not fit the
    per-module budget, or when two computations inside it would genuinely be
    developed and tuned separately.

inputs:
  # max_short / max_long cap how many prompts of each set this run uses. Cost is
  # per sample: one full traced forward, one set of dumped feature maps per module,
  # and one generation pass during emulation. Omit for no cap.
  short: ../../inputs/short.jsonl
  long: ../../inputs/long.jsonl
  max_short: 3
  max_long: 2

notes: |
  Weights exceed the GPU but fit host RAM (124 GiB) and disk, so tracing runs
  with the model resident on CPU and modules moved to the GPU as needed.
