[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autohelix"
version = "0.1.1"
description = "Agent-powered iterative optimization: put an AI agent in a verified improvement loop"
readme = "assets/README-pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Matthew Trager" },
    { name = "Elman Mansimov" },
    { name = "Yi Zhang" },
    { name = "Wei Xia" },
    { name = "Stefano Soatto" },
]
keywords = ["ai", "agent", "llm", "optimization", "code-generation", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/awslabs/AutoHelix"
Repository = "https://github.com/awslabs/AutoHelix"
Issues = "https://github.com/awslabs/AutoHelix/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
examples = [
    "numpy>=1.20",
    "scipy>=1.10",
    "scikit-learn>=1.4",
]
# Model partitioning / tracing / verification (partition/, `autohelix partition`)
partition = [
    "torch>=2.4",
    "safetensors>=0.4",
    "transformers>=4.45",
    "huggingface-hub>=0.25",
    # Required, not optional: a checkpoint larger than the GPU is loaded with
    # device_map/max_memory and the assembled model is dispatched with
    # accelerate.dispatch_model. Without it those paths fall back to the host.
    "accelerate>=1.0",
    "numpy>=1.20",
]

[project.scripts]
autohelix = "autohelix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autohelix", "partition/model_partition", "bootstrap"]

# The bundled model specs, loop defaults and sample inputs are data the CLI reads
# at runtime (`autohelix partition list/run`), and the specs reference the input
# sets by a path relative to themselves. Mapping both directories inside the
# package preserves that relationship in an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"partition/config" = "model_partition/config"
"partition/inputs" = "model_partition/inputs"

# Scope the source distribution to the package + packaging metadata only, so it
# doesn't sweep in the whole working tree (docs, examples, assets, CI config, or
# local-only files). only-include replaces hatchling's default include patterns
# (which would otherwise grab every README.md and .gitignore in the tree), so the
# sdist stays as clean as the wheel. The PyPI readme/LICENSE/NOTICE are added
# via force-include since they live outside the only-included paths.
[tool.hatch.build.targets.sdist]
only-include = ["src/autohelix", "partition/model_partition", "partition/config", "partition/inputs", "bootstrap"]

[tool.hatch.build.targets.sdist.force-include]
"assets/README-pypi.md" = "assets/README-pypi.md"
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"
"pyproject.toml" = "pyproject.toml"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (run with: pytest -m slow)",
    "bootstrap: the NKI bootstrap gate and repo materialization (no device, no network)",
]
